[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-data-analyst"
version = "0.1.0"
description = "A safe, small agentic analyst for real NYC taxi data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "google-genai>=1.0,<2",
  "langgraph>=0.2,<2",
  "mcp>=1.0,<2",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "prometheus-client>=0.21,<1",
  "python-dotenv>=1.0,<2",
  "sqlglot>=26,<29",
  "streamlit>=1.41,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]
tracing = ["langfuse>=3,<4"]

[project.scripts]
taxi-download = "data_analyst.data:main"
taxi-eval = "data_analyst.evaluation:main"
taxi-mcp = "data_analyst.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/data_analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

